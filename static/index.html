<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Rivals Auction House</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #e3000f;
    --gold: #ffd700;
    --gold-dim: #b8960a;
    --dark: #0a0a0f;
    --dark2: #111118;
    --dark3: #1a1a24;
    --panel: #13131d;
    --border: #2a2a3d;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --green: #00e676;
    --blue: #2979ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--dark);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.4;
  }

  body::after {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none; z-index: 9998;
  }

  #screen-landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 2rem;
  }

  .hero-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(227,0,15,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(227,0,15,0.08) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridDrift 20s linear infinite;
  }
  @keyframes gridDrift {
    from { background-position: 0 0; }
    to { background-position: 60px 60px; }
  }

  .logo-wrap {
    position: relative;
    text-align: center;
    margin-bottom: 3rem;
    z-index: 1;
  }

  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.4em;
    color: var(--red);
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  .logo-main {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 10vw, 7rem);
    line-height: 0.9;
    background: linear-gradient(135deg, #fff 0%, var(--gold) 50%, var(--red) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(227,0,15,0.4));
  }

  .logo-accent {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    letter-spacing: 0.15em;
    color: var(--gold);
    display: block;
    margin-top: 0.25rem;
  }

  .landing-card {
    position: relative;
    z-index: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    border-top: 2px solid var(--red);
    border-radius: 4px;
    padding: 2.5rem;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 0 60px rgba(227,0,15,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  .landing-card h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1.5rem;
    text-align: center;
  }

  .input-group {
    margin-bottom: 1.25rem;
  }
  .input-group label {
    display: block;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }
  .input-group input {
    width: 100%;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 0.7rem 1rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .input-group input:focus { border-color: var(--red); }
  .input-group input::placeholder { color: var(--muted); font-weight: 400; }

  .choice-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }

  .choice-btn {
    padding: 1rem;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .choice-btn.selected {
    background: rgba(227,0,15,0.12);
    border-color: var(--red);
    color: #fff;
    box-shadow: 0 0 20px rgba(227,0,15,0.2);
  }
  .choice-btn:hover:not(.selected) { border-color: var(--muted); }
  .choice-btn .choice-icon { font-size: 1.8rem; display: block; margin-bottom: 0.3rem; }

  .join-code-wrap { display: none; }
  .join-code-wrap.visible { display: block; }

  .host-settings {
    display: none;
    margin-bottom: 1rem;
    padding: 1rem;
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 3px;
  }
  .host-settings.visible { display: block; }

  .btn-primary {
    width: 100%;
    padding: 0.9rem 2rem;
    background: var(--red);
    border: none;
    border-radius: 3px;
    color: #fff;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .btn-primary::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  }
  .btn-primary:hover { background: #ff1a26; box-shadow: 0 0 30px rgba(227,0,15,0.4); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .error-msg {
    color: var(--red);
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    margin-top: 0.5rem;
    display: none;
  }
  .error-msg.visible { display: block; }
</style>
</head>
<body>

<div id="screen-landing">
  <div class="hero-grid"></div>

  <div class="logo-wrap">
    <div class="logo-sub">Welcome to the</div>
    <div class="logo-main">Marvel Rivals</div>
    <span class="logo-accent">Auction House</span>
  </div>

  <div class="landing-card">
    <h2>Sign In & Choose Your Role</h2>

    <div class="input-group">
      <label>Your Username</label>
      <input type="text" id="username-input" placeholder="e.g. IronManFan99" maxlength="20" autocomplete="off" />
    </div>

    <div class="choice-row">
      <button class="choice-btn" id="btn-host" onclick="selectMode('host')">
        <span class="choice-icon">🏛️</span>
        HOST ROOM
      </button>
      <button class="choice-btn" id="btn-join" onclick="selectMode('join')">
        <span class="choice-icon">🔗</span>
        JOIN ROOM
      </button>
    </div>

    <div class="join-code-wrap" id="join-code-wrap">
      <div class="input-group">
        <label>Room Code</label>
        <input type="text" id="room-code-input" placeholder="e.g. MX4K2R" maxlength="6" autocomplete="off" style="text-transform:uppercase;letter-spacing:0.2em" />
      </div>
    </div>

    <div class="host-settings" id="host-settings">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.75rem;margin-bottom:1rem">
        <div class="input-group" style="margin-bottom:0">
          <label>Starting Balance ($)</label>
          <input type="number" id="setting-balance" value="10000" min="100" step="100" />
        </div>
        <div class="input-group" style="margin-bottom:0">
          <label>Bid Increment ($)</label>
          <input type="number" id="setting-increment" value="100" min="10" step="10" />
        </div>
      </div>
      <div class="input-group" style="margin-bottom:0">
        <label>Max Players</label>
        <input type="number" id="setting-maxplayers" value="20" min="2" max="100" step="1" />
      </div>
    </div>

    <div class="error-msg" id="landing-error">Something went wrong. Please try again.</div>

    <button class="btn-primary" id="enter-btn" onclick="enterRoom()" disabled>ENTER THE ARENA</button>
  </div>
</div>

<script>
let MODE = null;

document.getElementById('username-input').addEventListener('input', checkLandingReady);
document.getElementById('username-input').addEventListener('keydown', e => { if (e.key === 'Enter') enterRoom(); });
document.getElementById('room-code-input').addEventListener('input', e => {
  e.target.value = e.target.value.toUpperCase();
  checkLandingReady();
});

function selectMode(mode) {
  MODE = mode;
  document.getElementById('btn-host').classList.toggle('selected', mode === 'host');
  document.getElementById('btn-join').classList.toggle('selected', mode === 'join');
  document.getElementById('join-code-wrap').classList.toggle('visible', mode === 'join');
  document.getElementById('host-settings').classList.toggle('visible', mode === 'host');
  checkLandingReady();
}

function checkLandingReady() {
  const username = document.getElementById('username-input').value.trim();
  const code = document.getElementById('room-code-input')?.value.trim();
  const ready = username && MODE && (MODE === 'host' || (MODE === 'join' && code?.length >= 4));
  document.getElementById('enter-btn').disabled = !ready;
}

async function enterRoom() {
  const username = document.getElementById('username-input').value.trim();
  const roomCodeInput = document.getElementById('room-code-input')?.value.trim().toUpperCase();
  if (!username || !MODE) return;

  const btn = document.getElementById('enter-btn');
  btn.disabled = true;
  btn.textContent = 'ENTERING...';
  hideError();

  try {
    let data;
    if (MODE === 'host') {
      const startingBalance = parseInt(document.getElementById('setting-balance').value) || 10000;
      const bidIncrement = parseInt(document.getElementById('setting-increment').value) || 100;
      const maxPlayers = parseInt(document.getElementById('setting-maxplayers').value) || 20;
      const res = await fetch('/api/create-room', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, starting_balance: startingBalance, bid_increment: bidIncrement, max_players: maxPlayers }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || 'Failed to create room');
      data = await res.json();
    } else {
      const res = await fetch('/api/join-room', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, room_code: roomCodeInput }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || 'Room not found');
      data = await res.json();
    }

    window.location.href = `/game?room=${encodeURIComponent(data.room_code)}&user=${encodeURIComponent(data.username)}`;

  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = 'ENTER THE ARENA';
  }
}

function showError(msg) {
  document.getElementById('landing-error').textContent = msg;
  document.getElementById('landing-error').classList.add('visible');
}

function hideError() {
  document.getElementById('landing-error').classList.remove('visible');
}
</script>
</body>
</html>
